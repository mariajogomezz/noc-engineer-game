<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC Engineer Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>NOC Engineer Game</h1>

    <!-- Panel principal -->
    <div class="panel">
        <p>CPU: <span id="cpu">30</span>%</p>
        <p>Memoria: <span id="memory">40</span>%</p>
        <p>Usuarios: <span id="users">500</span></p>
        <p>SLA: <span id="sla">99.9</span>%</p>
        <p>Dinero: <span id="money">1000</span>€</p>
        <p>Pods: <span id="pods">3</span></p>
        <p>Puntos: <span id="score">0</span></p>
    </div>

    <!-- Incidente -->
    <div class="panel">
        <h2>Incidente activo</h2>
        <p id="incident">✅ Sin incidencias</p>
    </div>

    <!-- Última acción -->
    <div class="panel">
        <h2>Última acción</h2>
        <p id="message">
            Bienvenido al NOC Engineer Simulator
        </p>
    </div>

    <!-- Temporizador -->
    <div class="panel">
        <h2>Tiempo de respuesta</h2>

        <p>
            ⏱ Tiempo restante:
            <span id="timer">10</span>
            segundos
        </p>
    </div>

    <!-- Acciones -->
    <div class="panel">
        <h2>Acciones</h2>

        <button onclick="scalePods()">
            Escalar Pods
        </button>

        <button onclick="restartService()">
            Reiniciar Servicio
        </button>

        <button onclick="ignoreIncident()">
            Ignorar
        </button>
    </div>

    <script src="app.js"></script>

</body>

</html>
